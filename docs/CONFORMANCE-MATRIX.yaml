{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "MeshFleet public conformance matrix",
  "format": "json-compatible-yaml",
  "authority": [
    "COMPATIBILITY.md",
    "docs/CONFIG-TRANSLATION.md",
    "docs/ADAPTER-CONTRACT.md",
    "docs/A2A-PROGRAM.md"
  ],
  "evidence_status_authority": "COMPATIBILITY.md#conformance-status-vocabulary",
  "evidence_statuses": [
    "designed",
    "fixture-verified",
    "reference-conformance",
    "dormant-internal-durable-verified",
    "implemented-public-ingress",
    "documented",
    "static-profiled",
    "static-config-verified",
    "static-translation-verified",
    "process-handshake-verified",
    "semantic-tool-verified",
    "codec-conformance-verified",
    "runtime-launch-verified",
    "recovery-verified",
    "coupled",
    "proposed",
    "deferred",
    "gated",
    "unverified",
    "secret-rejected"
  ],
  "evidence_status_definitions": {
    "designed": "A normative contract exists; executable evidence is absent or separately classified.",
    "fixture-verified": "A language-neutral corpus has executable expected outcomes; no production surface is implied.",
    "reference-conformance": "An independent implementation agrees with the corpus; no public, durable, or authenticated ingress is implied.",
    "dormant-internal-durable-verified": "A private disabled-by-surface acceptance journal has migration, replay, atomicity, privacy, compatibility, and review evidence; still no public ingress, auth, or delivery claim.",
    "implemented-public-ingress": "Reserved for a separately reviewed public ingress with durable acceptance, current authorization, and compatibility evidence.",
    "documented": "Configuration or behavior is described; no executable proof.",
    "static-profiled": "A bounded target capability/configuration profile is normatively defined from static evidence; no translator execution, process launch, runtime observation, authentication, or semantic-tool proof.",
    "static-config-verified": "Target configuration shape is checked without a live client.",
    "static-translation-verified": "Independent offline translators agree with the shared deterministic translation corpus; no client launch, registry lookup, runtime observation, authentication, or semantic-tool proof.",
    "process-handshake-verified": "A process starts and completes the protocol handshake.",
    "semantic-tool-verified": "Representative tool calls and return shapes work through the target.",
    "codec-conformance-verified": "A provider-neutral codec and language-neutral fixture corpus pass conformance checks; no public canonical tool ingress is implied.",
    "runtime-launch-verified": "A runtime adapter launches and settles work with normalized evidence.",
    "recovery-verified": "Restart, expiry, fencing, cancellation, and replay are proven.",
    "coupled": "Behavior exists but remains implementation-specific to one runtime.",
    "proposed": "Contract or design exists; implementation evidence is absent.",
    "deferred": "Intentionally outside the current release boundary.",
    "gated": "Requires explicit human, security, credential, spend, or egress approval.",
    "unverified": "A field or integration is known but lacks the evidence required for a stronger registered status.",
    "secret-rejected": "Static preflight rejects secret-bearing configuration and emits no target configuration; this is rejection evidence only."
  },
  "inbound": [
    {
      "target": "generic-mcp-json",
      "status": "static-config-verified",
      "evidence": ["mcp.json"],
      "notes": "The packaged command shape is checked; test/mcp-stdio.test.ts separately verifies the process handshake."
    },
    {
      "target": "opencode-jsonc",
      "status": "documented",
      "evidence": ["README.md"],
      "notes": "Documentation example only; no config renderer or live client claim."
    },
    {
      "target": "claude-code-mcp-json",
      "status": "documented",
      "evidence": ["README.md"],
      "notes": "Documentation example only; no config renderer or live client claim."
    },
    {
      "target": "codex-mcp-json",
      "status": "documented",
      "evidence": ["README.md"],
      "notes": "Documentation example only; no config renderer or live client claim."
    }
  ],
  "outbound": [
    {
      "target": "runtime registry and OpenCode default",
      "status": "runtime-launch-verified",
      "evidence": ["src/runtime/registry.ts", "src/runtime/opencode.ts", "test/runtime-adapter.test.ts", "test/spawn-runtime-actually-runs.test.ts"],
      "notes": "spawn_fleet supports per-agent runtime selection in legacy lifecycle mode; unconfigured runtimes and durable-mode selection fail closed."
    },
    {
      "target": "local-process runtime adapter",
      "status": "runtime-launch-verified",
      "evidence": ["src/runtime/local-process.ts", "test/runtime-adapter.test.ts"],
      "notes": "Deterministic proof seam; no provider, network, or credentials."
    },
    {
      "target": "Claude Code worker launch",
      "status": "fixture-verified",
      "evidence": ["src/runtime/claude.ts", "test/runtime-claude-adapter.test.ts", "test/runtime-registry-claude.test.ts"],
      "notes": "Non-default and operator-configured; fixture evidence is not account, quota, or availability attestation."
    },
    {
      "target": "Kimi worker launch",
      "status": "fixture-verified",
      "evidence": ["src/runtime/kimi.ts", "test/runtime-kimi-adapter.test.ts", "test/runtime-registry-kimi.test.ts"],
      "notes": "Non-default and operator-configured; fixture evidence is not provider attestation."
    },
    {
      "target": "runtime failover",
      "status": "fixture-verified",
      "evidence": ["src/failover.ts", "test/failover-decision.test.ts", "test/failover-end-to-end.test.ts"],
      "notes": "Deterministic stub runtimes prove the bounded hop and ledger event; no real provider-outage claim."
    },
    {
      "target": "auth, network, and remote relay",
      "status": "deferred",
      "evidence": ["docs/A2A-THREAT-MODEL.md", "docs/ADAPTER-CONTRACT.md"]
    },
    {
      "target": "production multi-host coordinator",
      "status": "deferred",
      "evidence": ["docs/A2A-PROGRAM.md"]
    }
  ],
  "process_handshake": [
    {
      "target": "packaged npx -y meshfleet stdio",
      "status": "process-handshake-verified",
      "evidence": ["test/mcp-stdio.test.ts"]
    }
  ],
  "a2a_protocol": [
    {
      "target": "canonical codec v0.1",
      "status": "reference-conformance",
      "evidence": ["src/a2a/codec.ts", "reference/python/a2a_reference.py", "test/a2a-reference-python.test.ts"]
    },
    {
      "target": "canonical ingress contract v0.1",
      "status": "fixture-verified",
      "evidence": ["docs/A2A-INGRESS-CONTRACT-v0.1.md", "test/fixtures/a2a/ingress/v0.1/corpus.json"],
      "notes": "Fixtures verify the designed result vocabulary and ordering; no production ingress or store."
    },
    {
      "target": "offline local admission",
      "status": "unverified",
      "evidence": ["src/a2a/local-admission.ts", "reference/python/a2a_local_admission_reference.py", "test/a2a-local-admission.test.ts"],
      "notes": "One pure operation returns an ephemeral plan; no public ingress, authentication provider, persistence, or delivery."
    },
    {
      "target": "static harness mapping",
      "status": "fixture-verified",
      "evidence": ["src/a2a/static-harness-mapping.ts", "test/a2a-local-admission.test.ts", "test/fixtures/a2a/local-admission/v0.1/static-harness-mappings.json"],
      "notes": "Claimless static sidecar; not a client-config renderer or identity proof."
    },
    {
      "target": "offline delivery trace",
      "status": "reference-conformance",
      "evidence": ["src/a2a/delivery-trace.ts", "reference/python/a2a_delivery_trace_reference.py", "test/a2a-delivery-trace-python-reference.test.ts"],
      "notes": "No live transport or authenticated principal claim."
    },
    {
      "target": "two-host coordinator witness",
      "status": "reference-conformance",
      "evidence": ["blackbox/a2a-two-host-coordinator-v0.1/runner.mjs", "blackbox/a2a-two-host-coordinator-v0.1/python/runner.py"],
      "notes": "Deterministic offline model only; no production multi-host coordinator or shared authority."
    },
    {
      "target": "public authenticated canonical ingress",
      "status": "deferred",
      "evidence": ["docs/A2A-PROGRAM.md"]
    },
    {
      "target": "dormant durable acceptance journal",
      "status": "designed",
      "evidence": ["docs/A2A-DURABLE-ACCEPTANCE-v0.1.md", "docs/adr/0005-dormant-durable-acceptance-journal.md"],
      "notes": "Design records remain; the acceptance writer is absent from current main."
    },
    {
      "target": "Slice 4C-0 capability profile",
      "status": "designed",
      "evidence": ["docs/A2A-CAPABILITY-PROFILE-v0.1.md", "docs/adr/0006-capability-evidence-is-not-authority.md"],
      "notes": "Specification records remain; the former reference implementation is absent from current main."
    }
  ],
  "gates": [
    "No public authenticated canonical-envelope ingress.",
    "No live network transport or production multi-host coordinator.",
    "No provider account, credential, quota, availability, spend, or identity claim from fixture or label evidence."
  ]
}
