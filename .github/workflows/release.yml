# Provenance-signed releases (LH: the "prove it" project practicing its own
# thesis at the package layer). npm build-provenance only attests publishes
# that run in supported CI with OIDC — a local `npm publish` cannot produce
# it — so releases flow through this workflow.
#
# Publish authentication (one-time, maintainer — on npmjs.com, not in this repo):
#
#   PREFERRED: npm Trusted Publishing (OIDC). On npmjs.com -> meshfleet ->
#   Settings -> Trusted publishing, add a GitHub Actions publisher with
#   owner `johnmwhitman`, repository `agent-mesh`, workflow `release.yml`
#   (no environment). No long-lived token is involved; provenance is
#   generated automatically. Needs npm >= 11.5.1, which is why the publish
#   job runs Node 24 and asserts the npm version below.
#
#   FALLBACK: an npm GRANULAR access token with read-and-write on `meshfleet`
#   and "bypass 2FA" enabled, stored as the NPM_TOKEN repo secret. npm tries
#   OIDC first and falls back to this token.
#
# Why this matters (measured 2026-09-26): this workflow had NEVER published.
# Every run whose nine test legs went green (v0.15.1, v0.19.0, v0.20.0,
# v0.21.1, v0.21.2) signed provenance successfully and then got
# `E404 Not Found - PUT https://registry.npmjs.org/meshfleet` — npm's answer
# when the presented token cannot write the package. The NPM_TOKEN secret was
# last set 2026-07-24 and has never authenticated a publish; every version on
# npm (including 0.21.1, 2026-09-14) was published by hand, without provenance.
#
# To release: bump version + CHANGELOG on main, then push a tag:
#   git tag v0.14.0 && git push origin v0.14.0
# The workflow tests on the full matrix first; publish runs only if every
# leg is green. The resulting npm page shows the provenance badge linking
# the tarball to this repo, commit, and workflow run.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    # A green leg takes 5-14 minutes (release runs 2026-08-10 .. 2026-09-19). The v0.21.5 run
    # (35414063160) had all three windows-2022 legs hang in `npm test` until GitHub's 360-minute
    # default killed them — six hours to learn one failing test. 30 minutes is ~2x the slowest
    # honest leg and turns a hang into a failure the same hour.
    timeout-minutes: 30
    strategy:
      # Report every leg. fail-fast cancelled eight legs on v0.21.0 and v0.21.3 after one macOS
      # failure, so each attempt revealed one platform's problems at a time. `publish` still
      # `needs: test`, so any red or cancelled leg blocks publication exactly as before.
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Build BEFORE test: mcp-stdio.test.ts packs this package and asserts the
      # tarball contains dist/index.js, so without a build it fails on every
      # runner. ci.yml was fixed for exactly this (77d3fa3) and release.yml was
      # not — which meant the release path could never publish. It went unnoticed
      # because no release had ever actually been cut through this workflow.
      - run: npm run build
      - run: npm test
      - run: npm run typecheck

  publish:
    needs: test
    runs-on: ubuntu-latest
    # prepublishOnly re-runs build + the full suite (~5 min) before the upload.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC — required for npm provenance
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Require the tag to point at main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag $GITHUB_REF_NAME points at a commit not on main — refusing to publish"; exit 1; }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Node 24 bundles npm 11, which can publish through npm Trusted Publishing (OIDC).
          # Node 22 bundles npm 10, which can only use NPM_TOKEN.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Require an npm that supports trusted publishing (>= 11.5.1)
        run: |
          V=$(npm --version)
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$V" || {
            echo "npm $V cannot publish via OIDC trusted publishing (needs >= 11.5.1)"; exit 1; }
          echo "npm $V"
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          [ "$PKG" = "$TAG" ] || { echo "tag v$TAG != package.json $PKG"; exit 1; }
      # Auth: OIDC trusted publishing when configured on npmjs.com, else NPM_TOKEN.
      # An `E404 Not Found - PUT .../meshfleet` here means NEITHER credential can write
      # the package: configure the trusted publisher (preferred) or replace NPM_TOKEN.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
