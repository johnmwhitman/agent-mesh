# Provenance-signed releases (LH: the "prove it" project practicing its own
# thesis at the package layer). npm build-provenance only attests publishes
# that run in supported CI with OIDC — a local `npm publish` cannot produce
# it — so releases flow through this workflow.
#
# Publish authentication (one-time, maintainer — on npmjs.com, not in this repo):
#
#   PREFERRED: npm Trusted Publishing (OIDC). On npmjs.com -> meshfleet ->
#   Settings -> Trusted publishing, add a GitHub Actions publisher with
#   owner `johnmwhitman`, repository `agent-mesh`, workflow `release.yml`
#   (no environment). No long-lived token is involved; provenance is
#   generated automatically. Needs npm >= 11.5.1, which is why the publish
#   job runs Node 24 and asserts the npm version below.
#
#   NPM_TOKEN IS NOT USED BY DEFAULT. A token in the environment can stop npm
#   from attempting OIDC at all, so the default publish step carries no token.
#   Token publishing is an explicit opt-in: set the repository VARIABLE
#   NPM_PUBLISH_AUTH=token (Settings -> Secrets and variables -> Actions ->
#   Variables) and store a GRANULAR access token with read-and-write on
#   `meshfleet` and "bypass 2FA" as the NPM_TOKEN secret. Unset the variable
#   to return to OIDC.
#
# Why this matters (measured 2026-09-26): this workflow had NEVER published.
# Every run whose nine test legs went green (v0.15.1, v0.19.0, v0.20.0,
# v0.21.1, v0.21.2) signed provenance successfully and then got
# `E404 Not Found - PUT https://registry.npmjs.org/meshfleet` — npm's answer
# when the presented token cannot write the package. The NPM_TOKEN secret was
# last set 2026-07-24 and has never authenticated a publish; every version on
# npm (including 0.21.1, 2026-09-14) was published by hand, without provenance.
#
# To release: bump version + CHANGELOG on main, then push a tag:
#   git tag v0.14.0 && git push origin v0.14.0
# The workflow tests on the full matrix first; publish runs only if every
# leg is green. The resulting npm page shows the provenance badge linking
# the tarball to this repo, commit, and workflow run.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    # A green leg takes 5-14 minutes (release runs 2026-08-10 .. 2026-09-19). The v0.21.5 run
    # (35414063160) had all three windows-2022 legs hang in `npm test` until GitHub's 360-minute
    # default killed them — six hours to learn one failing test. 30 minutes is ~2x the slowest
    # honest leg and turns a hang into a failure the same hour.
    timeout-minutes: 30
    strategy:
      # Report every leg. fail-fast cancelled eight legs on v0.21.0 and v0.21.3 after one macOS
      # failure, so each attempt revealed one platform's problems at a time. `publish` still
      # `needs: test`, so any red or cancelled leg blocks publication exactly as before.
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Build BEFORE test: mcp-stdio.test.ts packs this package and asserts the
      # tarball contains dist/index.js, so without a build it fails on every
      # runner. ci.yml was fixed for exactly this (77d3fa3) and release.yml was
      # not — which meant the release path could never publish. It went unnoticed
      # because no release had ever actually been cut through this workflow.
      - run: npm run build
      - run: npm test
      - run: npm run typecheck

  publish:
    needs: test
    runs-on: ubuntu-latest
    # prepublishOnly re-runs build + the full suite (~5 min) before the upload.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC — required for npm provenance
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Require the tag to point at main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag $GITHUB_REF_NAME points at a commit not on main — refusing to publish"; exit 1; }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Node 24 bundles npm 11, which can publish through npm Trusted Publishing (OIDC).
          # Node 22 bundles npm 10, which cannot.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Require an npm that supports trusted publishing (>= 11.5.1)
        run: |
          V=$(npm --version)
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$V" || {
            echo "npm $V cannot publish via OIDC trusted publishing (needs >= 11.5.1)"; exit 1; }
          echo "npm $V"
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          [ "$PKG" = "$TAG" ] || { echo "tag v$TAG != package.json $PKG"; exit 1; }
      # Exactly one of the two publish steps runs.
      #
      # DEFAULT: npm Trusted Publishing (OIDC). No NODE_AUTH_TOKEN is set here on purpose;
      # a token present in the environment can make npm skip the OIDC exchange, which is how
      # a stale NPM_TOKEN would keep producing E404 after Trusted Publishing is configured.
      # An `E404 Not Found - PUT .../meshfleet` from this step means the trusted publisher
      # is not configured on npmjs.com for this repo + workflow file.
      - name: Publish (npm Trusted Publishing, OIDC)
        if: vars.NPM_PUBLISH_AUTH != 'token'
        run: npm publish --provenance --access public
      # OPT-IN ONLY: repository variable NPM_PUBLISH_AUTH=token selects the NPM_TOKEN secret.
      - name: Publish (NPM_TOKEN, explicitly selected)
        if: vars.NPM_PUBLISH_AUTH == 'token'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Lists this package on registry.modelcontextprotocol.io so MCP clients can
  # discover it. `needs: publish` means this only runs after the npm publish
  # job above has already succeeded — the tarball is on npmjs.org before we
  # ever touch the registry. Deliberately its own job, not a step tacked onto
  # `publish`: a registry outage or a stale namespace grant must never be able
  # to roll back or fail the npm publish that already happened. If this job
  # fails, the workflow run shows red (visible to a maintainer) but the
  # published npm package is unaffected either way — there is nothing left
  # here that could "un-publish" it.
  #
  # Auth: GitHub OIDC (`mcp-publisher login github-oidc`) — no secret to
  # provision or rotate. It resolves to the `io.github.johnmwhitman/*`
  # namespace because that's this repo's owner, which is exactly the
  # namespace server.json's `name` uses. See docs:
  #   https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/github-actions.mdx
  #   https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/authentication.mdx
  publish-mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC — required for github-oidc registry auth
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      # Checks all FOUR sources of truth against each other, not just tag vs.
      # server.json: the git tag, package.json .version, server.json .version,
      # and server.json .packages[0].version. A version bump that touches
      # package.json and forgets server.json (or vice versa) fails here with
      # the exact field(s) named, before mcp-publisher ever runs. The same
      # drift is also caught earlier, at PR time, by
      # test/mcp-registry-server-json-version-parity.test.ts (part of `npm
      # test`, run in CI on every push) — this step additionally confirms the
      # actual release tag agrees, which a local/PR-time test cannot see.
      - name: Verify tag, package.json, and server.json versions all agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRV_PKG=$(node -p "require('./server.json').packages[0].version")
          fail=0
          [ "$TAG" = "$PKG" ] || { echo "VERSION MISMATCH: git tag $GITHUB_REF_NAME (-> $TAG) != package.json .version ($PKG)"; fail=1; }
          [ "$TAG" = "$SRV" ] || { echo "VERSION MISMATCH: git tag $GITHUB_REF_NAME (-> $TAG) != server.json .version ($SRV)"; fail=1; }
          [ "$TAG" = "$SRV_PKG" ] || { echo "VERSION MISMATCH: git tag $GITHUB_REF_NAME (-> $TAG) != server.json .packages[0].version ($SRV_PKG)"; fail=1; }
          [ "$PKG" = "$SRV" ] || { echo "VERSION MISMATCH: package.json .version ($PKG) != server.json .version ($SRV)"; fail=1; }
          [ "$PKG" = "$SRV_PKG" ] || { echo "VERSION MISMATCH: package.json .version ($PKG) != server.json .packages[0].version ($SRV_PKG)"; fail=1; }
          [ "$SRV" = "$SRV_PKG" ] || { echo "VERSION MISMATCH: server.json .version ($SRV) != server.json .packages[0].version ($SRV_PKG)"; fail=1; }
          if [ "$fail" = "1" ]; then
            echo ""
            echo "Refusing to publish to the MCP Registry: tag, package.json, and server.json must all agree on the version."
            exit 1
          fi
          echo "OK — tag=$TAG package.json=$PKG server.json.version=$SRV server.json.packages[0].version=$SRV_PKG"
      # Pinned to a specific mcp-publisher release (not "latest") so this step
      # can't silently change behavior between releases. Bump deliberately:
      # https://github.com/modelcontextprotocol/registry/releases
      #
      # SHA-256 below is pinned per architecture from TWO independent sources
      # cross-checked before hardcoding: (1) the v1.8.1 release's own
      # published checksums file
      # (https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/registry_1.8.1_checksums.txt)
      # and (2) downloading each linux tarball directly and running
      # `shasum -a 256` locally. Both agreed exactly; see the PR receipt for
      # the raw commands and output. Verified with `sha256sum -c` BEFORE
      # extraction, so a corrupted or substituted asset fails the job here —
      # nothing from the archive runs first.
      - name: Install mcp-publisher (pinned v1.8.1, checksum-verified)
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
        run: |
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          FILE="mcp-publisher_linux_${ARCH}.tar.gz"
          case "$ARCH" in
            amd64) SHA256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc" ;;
            arm64) SHA256="8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4" ;;
            *) echo "no pinned mcp-publisher checksum for arch '$ARCH' — add one from the release's checksums file before extending this workflow to this runner arch"; exit 1 ;;
          esac
          curl -fsSL -o "$FILE" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${FILE}"
          echo "${SHA256}  ${FILE}" | sha256sum -c - || {
            echo "mcp-publisher asset failed SHA-256 verification against the pinned hash — refusing to extract a possibly-tampered binary"
            exit 1
          }
          tar xz -f "$FILE" mcp-publisher
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
